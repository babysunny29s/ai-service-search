[project]
name = "ai-service-search"
version = "0.1.0"
description = "Profile Search agent: HTTP API, RabbitMQ worker, MCP client for search providers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "mcp>=1.9,<2",
    "beautifulsoup4>=4.12",
    "openai>=1.40",
    "langfuse>=4.17.0",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.4.6",
    "yt-dlp>=2025.1",
    "aio-pika>=9.4",
    "minio>=7.2",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
google-vision = ["google-cloud-vision>=3.7"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
